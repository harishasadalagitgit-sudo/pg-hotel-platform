services:
  postgres:
    image: postgres:16
    container_name: pg-hotel-db

    environment:
      POSTGRES_DB: pg_hotel
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pg-hotel-backend

    ports:
      - "3001:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    depends_on:
      - postgres

volumes:
  postgres_data:
